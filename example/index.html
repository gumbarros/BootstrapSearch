<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BootstrapSearch - AJAX & Local Autocomplete for Bootstrap 5</title>
  <meta name="description"
    content="BootstrapSearch is a Bootstrap 5 autocomplete and multi-select search component with AJAX support, local data search, keyboard navigation, and customizable dropdowns.">
  <meta name="keywords"
    content="BootstrapSearch, Bootstrap 5 autocomplete, AJAX search, multi-select, local data search, dropdown autocomplete">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link id="highlight-light" rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" disabled>
  <link id="highlight-dark" rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

  <meta property="og:title" content="BootstrapSearch - AJAX & Local Autocomplete for Bootstrap 5">
  <meta property="og:description"
    content="BootstrapSearch is a Bootstrap 5 autocomplete and multi-select search component with AJAX support, local data search, keyboard navigation, and customizable dropdowns.">
  <meta property="og:image" content="https://gumbarros.github.io/BootstrapSearch/logo.png">
  <meta property="og:url" content="https://gumbarros.github.io/BootstrapSearch">
  <meta property="og:type" content="website">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>

<body class="bg-body text-body">
  <header class="hero">
    <div class="container">
      <div class="hero-content">
        <div class="hero-logo-wrap">
          <img src="logo.png" class="demo-logo" alt="BootstrapSearch Logo">
        </div>
        <h1 class="hero-title mb-0">BootstrapSearch</h1>
        <p class="hero-copy mb-0">A compact autocomplete and multi-select control for Bootstrap 5.3.</p>
        <div class="hero-actions">
          <a class="btn btn-outline-secondary" href="https://github.com/gumbarros/BootstrapSearch" target="_blank"
            rel="noopener">
            <i class="bi bi-github me-2" aria-hidden="true"></i>GitHub
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-3 pt-3">
    <section id="examples">
      <div id="exampleCards" class="row g-4"></div>
    </section>
  </main>

  <footer class="container pb-4 text-center text-body-secondary">
    <p class="mb-0">
      Made with <i class="bi bi-heart-fill text-danger" aria-label="love"></i> by
      <a href="https://www.github.com/gumbarros" target="_blank" rel="noopener">gumbarros</a>
      | <a href="https://www.github.com/gumbarros/BootstrapSearch" target="_blank" rel="noopener"><i
          class="bi bi-github me-1" aria-hidden="true"></i>BootstrapSearch</a>
    </p>
  </footer>

  <button id="themeToggle" class="theme-toggle btn" type="button" aria-label="Toggle color theme"></button>

  <script type="module" src="./main.ts"></script>
</body>

</html>
